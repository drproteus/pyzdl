[project]
name = "pyzdl"
version = "0.1.0"
description = "A Python launcher for GZDoom and other Doom source ports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10,<3.13"
# NOTE: runtime dependencies live in the `dev` dependency group below rather
# than `[project].dependencies`. This project is an application
# (`tool.uv.package = false`), and declaring `dependencies` makes setuptools
# expose `install_requires`, which py2app >= 0.28.9 rejects.

[dependency-groups]
dev = [
    "click==8.1.7",
    "wxPython==4.2.5",
    "black==24.10.0",
    "ruff==0.6.9",
    "pdoc3==0.11.1",
    "py2app==0.28.10; sys_platform == 'darwin'",
    "pyinstaller>=6.22.3",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "build", "dist", "pages"]
